<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PLM{% endblock %}</title>
  <link rel="icon" href="{{ request.url_for('static', path='logo-nav.svg') }}" type="image/svg+xml">
  <link rel="manifest" href="{{ request.url_for('manifest') }}">
  <meta name="theme-color" content="#0f172a">
  <style>
    /* ── Reset + base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.5;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Top nav ──────────────────────────────────────────────────────── */
    nav {
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      height: 4rem;
      gap: 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      /* Scroll horizontally when the viewport is too narrow to fit all items.
         scrollbar-width/display:none hides the bar without losing functionality. */
      overflow-x: auto;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    .nav-brand {
      display: flex;
      align-items: center;
      margin-right: 0.5rem;
      flex-shrink: 0;
    }
    .nav-brand img {
      height: 55px;
      width: auto;
    }
    nav a {
      color: #94a3b8;
      font-size: 0.875rem;
      padding: 0.2rem 0;
      border-bottom: 2px solid transparent;
    }
    nav a:hover { color: #f1f5f9; text-decoration: none; }
    nav a.active { color: #f1f5f9; border-bottom-color: #3b82f6; }
    .nav-spacer { flex: 1; }
    .nav-logout {
      background: none;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.25rem 0.7rem;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .nav-logout:hover { border-color: #64748b; color: #e2e8f0; }

    /* ── Flash messages ───────────────────────────────────────────────── */
    .flash {
      padding: 0.7rem 1.25rem;
      font-size: 0.875rem;
      border-left: 4px solid;
    }
    .flash.success { background: #f0fdf4; border-color: #16a34a; color: #15803d; }
    .flash.error   { background: #fef2f2; border-color: #dc2626; color: #b91c1c; }
    .flash.info    { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }

    /* ── Main container ───────────────────────────────────────────────── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem;
    }

    /* ── Typography ───────────────────────────────────────────────────── */
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.25rem; color: #0f172a; }
    h2 { font-size: 1.05rem; font-weight: 600; margin: 1.25rem 0 0.6rem; color: #334155; }

    /* ── Forms ────────────────────────────────────────────────────────── */
    .form-row {
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.2rem; }
    label { font-size: 0.8rem; color: #64748b; font-weight: 500; }
    input[type=text],
    input[type=password],
    input[type=number],
    textarea,
    select {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0.375rem 0.6rem;
      font-size: 0.875rem;
      background: #fff;
      color: #1e293b;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 1px;
      border-color: transparent;
    }
    textarea { resize: vertical; }

    /* ── Buttons ──────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.375rem 0.85rem;
      border-radius: 6px;
      font-size: 0.875rem;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn:hover { filter: brightness(0.92); text-decoration: none; }
    .btn-primary   { background: #2563eb; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; border-color: #cbd5e1; }
    .btn-danger    { background: #dc2626; color: #fff; }
    .btn-ghost     { background: transparent; color: #475569; border-color: #e2e8f0; }
    .btn-sm { padding: 0.2rem 0.55rem; font-size: 0.8rem; }

    /* ── Utilities ────────────────────────────────────────────────────── */
    .text-muted { color: #6b7280; font-size: 0.85rem; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    details > summary {
      cursor: pointer;
      color: #64748b;
      font-size: 0.875rem;
      padding: 0.3rem 0;
      list-style: none;
      user-select: none;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▶ "; font-size: 0.7em; }
    details[open] > summary::before { content: "▼ "; }

    /* ── Card ─────────────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.1rem;
    }
    .card + .card { margin-top: 0.75rem; }

    /* ── Swipe tab transition ─────────────────────────────────────────── */
    /* Opt in to cross-document View Transitions.  Every same-origin
       navigation would now animate, so the pageswap/pagereveal handlers in
       <head> skip the transition unless the navigation came from a tab
       swipe — ordinary link clicks and form redirects stay instant.
       Browsers without support simply navigate without animation. */
    @view-transition { navigation: auto; }
    /* Own transition group for the nav so it stays put while the page
       content slides underneath it. */
    nav { view-transition-name: plm-nav; }

    @keyframes plm-out-left  { to   { transform: translateX(-100%); } }
    @keyframes plm-out-right { to   { transform: translateX(100%); } }
    @keyframes plm-in-left   { from { transform: translateX(-100%); } }
    @keyframes plm-in-right  { from { transform: translateX(100%); } }

    /* swipe-next: finger moved left → old page leaves left, new enters from right */
    html:active-view-transition-type(swipe-next)::view-transition-old(root) {
      animation: 220ms ease-in both plm-out-left;
    }
    html:active-view-transition-type(swipe-next)::view-transition-new(root) {
      animation: 220ms ease-out both plm-in-right;
    }
    html:active-view-transition-type(swipe-prev)::view-transition-old(root) {
      animation: 220ms ease-in both plm-out-right;
    }
    html:active-view-transition-type(swipe-prev)::view-transition-new(root) {
      animation: 220ms ease-out both plm-in-left;
    }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
    }

    {% block extra_style %}{% endblock %}
  </style>
  <script>
  /* Swipe transition hand-off between the departing and the arriving page.
     The swipe handler (end of <body>) stores the direction in sessionStorage
     just before navigating.  Must run in <head>: pagereveal fires before the
     new page's first render, so a listener added later would miss it. */
  (function () {
    var KEY = 'plm-swipe-dir';
    function readDir() {
      try { return sessionStorage.getItem(KEY); } catch (e) { return null; }
    }

    // Departing page: only swipe navigations get a transition
    window.addEventListener('pageswap', function (e) {
      if (e.viewTransition && !readDir()) e.viewTransition.skipTransition();
    });

    // Arriving page: tag the transition with its direction for the CSS above
    window.addEventListener('pagereveal', function (e) {
      var dir = readDir();
      try { sessionStorage.removeItem(KEY); } catch (err) { /* storage blocked */ }
      if (!e.viewTransition) return;
      if (dir === 'next' || dir === 'prev') {
        e.viewTransition.types.add('swipe-' + dir);
      } else {
        e.viewTransition.skipTransition();
      }
    });
  })();
  </script>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <a class="nav-brand" href="{{ request.url_for('project_list') }}">
    <img src="{{ request.url_for('static', path='logo-nav.svg') }}" alt="PLM">
  </a>
  <a href="{{ request.url_for('project_list') }}"
     {% if request.url.path == '/' %}class="active"{% endif %}>Projects</a>
  <a href="{{ request.url_for('planning_page') }}"
     {% if request.url.path.startswith('/planning') %}class="active"{% endif %}>Planning</a>
  <a href="{{ request.url_for('inbox_page') }}"
     {% if request.url.path == '/inbox' %}class="active"{% endif %}>Inbox</a>
  <a href="{{ request.url_for('profile_page') }}"
     {% if request.url.path == '/profile' %}class="active"{% endif %}>Profile</a>
  <div class="nav-spacer"></div>
  <form method="post" action="{{ request.url_for('logout') }}">
    <button class="nav-logout" type="submit">Logout</button>
  </form>
</nav>

{% if flash %}
<div class="flash {{ flash.category }}">{{ flash.message }}</div>
{% endif %}

<!-- SSE live-refresh banner: hidden until an MCP write arrives mid-edit -->
<div id="sse-banner" style="
  display: none;
  background: #1e3a5f;
  color: #bfdbfe;
  font-size: 0.8rem;
  padding: 0.4rem 1.25rem;
  cursor: pointer;
" onclick="window.location.reload()">
  Changes detected — click to reload
</div>

<main>
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}

<script>
/* SSE live-refresh — reconnects to GET /events and reloads the page (or shows
   the banner) whenever the server sends a 'reload' message carrying a data
   version newer than the one this page was rendered with.  Messages that are
   not newer are late echoes of changes the page already shows (typically our
   own POST) and are ignored — see _data_version() in app.py.

   Auto-reload is suppressed while the user has a form field focused so that
   in-progress edits are not lost.  The banner lets them reload when ready. */
(function () {
  if (!window.EventSource) return;  // old browser — degrade gracefully

  var banner = document.getElementById('sse-banner');
  // Data version this page was rendered with (µs mtime — safe as a JS number)
  var pageVersion = {{ data_version() }};

  function connect() {
    var es = new EventSource('{{ request.url_for("sse_events") }}');

    // Close the SSE connection as soon as the page starts unloading (navigation
    // or refresh).  Without this the browser may deliver a stale 'reload' event
    // to the departing page, which would call window.location.reload() and abort
    // the navigation — making nav buttons appear broken.  Closing here also
    // suppresses the Firefox console error about an interrupted connection.
    window.addEventListener('beforeunload', function () { es.close(); }, { once: true });

    es.onmessage = function (e) {
      var parts = e.data.split(' ');
      if (parts[0] !== 'reload') return;
      // Already showing this data (or newer) — nothing to reload for
      if (Number(parts[1]) <= pageVersion) return;

      // Check whether the user is actively typing in a form field
      var active = document.activeElement;
      var editing = active && (
        active.tagName === 'INPUT' ||
        active.tagName === 'TEXTAREA' ||
        active.tagName === 'SELECT'
      );

      if (editing) {
        // Surface the banner so they can reload at a safe moment
        if (banner) banner.style.display = 'block';
      } else {
        window.location.reload();
      }
    };

    es.onerror = function () {
      // Close this connection; browser will not auto-reconnect after onerror
      // on a closed source.  Retry after 5 s so a server restart eventually
      // reconnects without flooding the server with rapid reconnect loops.
      es.close();
      setTimeout(connect, 5000);
    };
  }

  connect();
})();
</script>

<script>
/* Horizontal swipe to move between the top-level tabs (touch only).
   Swipe left → next tab, swipe right → previous; wraps around at both ends.

   A gesture is ignored when:
   - it starts inside something that scrolls horizontally itself (board
     columns, the nav bar on narrow screens, code blocks) — those swipes
     belong to that element;
   - another handler called preventDefault on a touchmove — that is how the
     planning block drag and SortableJS freeze the page while dragging.
     This listener is registered last on window, so it sees their result;
   - a form field is focused (unsaved input);
   - it is multi-touch (pinch), turns out mostly vertical (page scroll),
     or ends with text selected (long-press selection drag). */
(function () {
  {%- set p = request.url.path %}
  {%- if p == '/' or p.startswith('/projects') %}{% set tab_index = 0 %}
  {%- elif p.startswith('/planning') %}{% set tab_index = 1 %}
  {%- elif p == '/inbox' %}{% set tab_index = 2 %}
  {%- elif p == '/profile' %}{% set tab_index = 3 %}
  {%- else %}{% set tab_index = -1 %}{% endif %}
  var TABS = [
    '{{ request.url_for("project_list") }}',
    '{{ request.url_for("planning_page") }}',
    '{{ request.url_for("inbox_page") }}',
    '{{ request.url_for("profile_page") }}'
  ];
  var current = {{ tab_index }};
  if (current < 0) return;  // not a tab page

  var AXIS_LOCK_PX   = 10;    // travel before deciding horizontal vs vertical
  var MIN_FRACTION   = 0.25;  // a slow drag must cover this much of the screen…
  var FLICK_MIN_PX   = 50;    // …or a quick flick at least this far…
  var FLICK_PX_PER_MS = 0.4;  // …at this speed

  var start = null;  // {x, y, t} of the current candidate gesture

  // Feedback overlay: darkens as the finger travels, reaching full strength
  // once the swipe is far enough to navigate.  pointer-events:none keeps it
  // from ever intercepting taps.
  var shade = document.createElement('div');
  shade.style.cssText = 'position:fixed;inset:0;background:#0f172a;opacity:0;' +
                        'pointer-events:none;z-index:1000;transition:opacity 150ms';
  document.body.appendChild(shade);
  function setShade(dx) {
    var progress = Math.min(1, Math.abs(dx) / (window.innerWidth * MIN_FRACTION));
    shade.style.transition = dx ? 'none' : 'opacity 150ms';  // track finger 1:1, fade out on release
    shade.style.opacity = String(progress * 0.25);
  }

  function scrollsHorizontally(el) {
    for (; el && el !== document.body; el = el.parentElement) {
      var ox = getComputedStyle(el).overflowX;
      if ((ox === 'auto' || ox === 'scroll') && el.scrollWidth > el.clientWidth) return true;
    }
    return false;
  }

  window.addEventListener('touchstart', function (e) {
    start = null;
    if (e.touches.length !== 1 || scrollsHorizontally(e.target)) return;
    // Don't navigate away from a half-typed form field
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    var t = e.touches[0];
    start = { x: t.clientX, y: t.clientY, t: e.timeStamp, locked: false };
  }, { passive: true });

  window.addEventListener('touchmove', function (e) {
    if (!start) return;
    if (e.touches.length !== 1 || e.defaultPrevented) { start = null; setShade(0); return; }
    var t = e.touches[0];
    if (start.locked) { setShade(t.clientX - start.x); return; }
    var dx = Math.abs(t.clientX - start.x);
    var dy = Math.abs(t.clientY - start.y);
    if (Math.max(dx, dy) < AXIS_LOCK_PX) return;
    // First decisive movement is vertical → the user is scrolling the page
    if (dy >= dx) { start = null; return; }
    start.locked = true;
  }, { passive: true });

  window.addEventListener('touchcancel', function () { start = null; setShade(0); });

  window.addEventListener('touchend', function (e) {
    setShade(0);
    if (!start || !start.locked) { start = null; return; }
    var t  = e.changedTouches[0];
    var dx = t.clientX - start.x;
    var dy = t.clientY - start.y;
    var dt = Math.max(1, e.timeStamp - start.t);
    start = null;

    if (Math.abs(dx) < 1.5 * Math.abs(dy)) return;  // drifted diagonal
    var sel = window.getSelection && window.getSelection();
    if (sel && sel.toString()) return;
    var far   = Math.abs(dx) >= window.innerWidth * MIN_FRACTION;
    var flick = Math.abs(dx) >= FLICK_MIN_PX && Math.abs(dx) / dt >= FLICK_PX_PER_MS;
    if (!far && !flick) return;

    var dir    = dx < 0 ? 'next' : 'prev';
    var target = (current + (dir === 'next' ? 1 : -1) + TABS.length) % TABS.length;
    // Read by the pageswap/pagereveal handlers in <head> to animate the slide
    try { sessionStorage.setItem('plm-swipe-dir', dir); } catch (err) { /* no animation */ }
    window.location.href = TABS[target];
  });
})();
</script>

<script>
/* Register the PWA service worker so the app is installable. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('{{ request.url_for("static", path="service-worker.js") }}');
}
</script>

</body>
</html>
